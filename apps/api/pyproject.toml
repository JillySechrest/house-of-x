[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-of-x-api"
version = "0.1.0"
description = "Server-side Marvel API proxy and cache for the House of X catalog"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "mock_marvel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
